name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to the commit SHA of a release, not a tag: tags move, and
# a moved tag has already broken this job once (setup-android's v3 tag gained
# a "tools" package install, which Google no longer serves). The trailing
# comment names the release each SHA came from; Dependabot can bump the SHAs.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # v4, not v3: v3 asks sdkmanager for the "tools" package, which Google
      # stopped serving (removed Sep 2026), so the action fails before any
      # build runs. v4 skips it and only installs cmdline-tools/platform-tools;
      # the runner image already ships build-tools 37.0.0 and platform 37.0.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # Robolectric does not resolve its ~200 MB android-all-instrumented jar
      # through Gradle: it fetches it from Maven Central while the tests run,
      # into ~/.m2/repository, so setup-java's Gradle cache never holds it and
      # every run would download it again. Cache that directory instead. The
      # key covers the files that pick the Robolectric and SDK versions, and
      # restore-keys keeps a previous jar around when only those versions move.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Android Lint
        run: ./gradlew :app:lintDebug --console=plain

      # Unsigned on purpose: signing credentials never live in CI for a public
      # repo. This proves R8 + resource shrinking still produce a release.
      - name: Release build (unsigned)
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      # Release gate. Fails if a dependency bump re-adds INTERNET or
      # ACCESS_NETWORK_STATE to the shipped release artifacts, and if any
      # 64-bit native library in the release AAB has a PT_LOAD segment aligned
      # below 16 KB. Prints the permission list the release APK requests and
      # the alignment of every library in the AAB — the file uploaded to Play.
      - name: Verify release permissions and 16 KB alignment
        run: ./scripts/check-release-permissions.sh

      # Deliberately after the gate: a build that reintroduced INTERNET or a
      # 4 KB-aligned 64-bit library fails above and never reaches this step.
      # The APK is app-release-unsigned.apk (no signing credentials in CI), so
      # these are for inspecting/verifying the build, not for installing.
      - name: Upload release APK and AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
