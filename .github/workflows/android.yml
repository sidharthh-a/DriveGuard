name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Android Lint
        run: ./gradlew :app:lintDebug --console=plain

      # Unsigned on purpose: signing credentials never live in CI for a public
      # repo. This proves R8 + resource shrinking still produce a release.
      - name: Release build (unsigned)
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      # Privacy gate: fails if a dependency bump re-adds INTERNET or
      # ACCESS_NETWORK_STATE to the shipped release artifact, and prints the
      # permission list the release APK actually requests.
      - name: Verify release permissions
        run: ./scripts/check-release-permissions.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
